<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Libraries</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libraries">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bar:#2f5d50; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--bar);
    font:14px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; transition:background .3s; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bar); transition:background .3s; }
  #top { flex:none; height:env(safe-area-inset-top,0px); background:var(--bar); transition:background .3s; }
  #stage { position:relative; flex:1; min-height:0; overflow:hidden; }
  .panel { position:absolute; inset:0; will-change:transform; transition:transform .32s cubic-bezier(.22,.8,.3,1); }
  .panel.drag { transition:none; }
  .panel iframe { display:block; width:100%; height:100%; border:0; }

  #bar { flex:none; position:relative; display:flex; background:var(--bar); color:#fff;
    padding-bottom:env(safe-area-inset-bottom,0px); transition:background .3s; }
  #bar button { flex:1; height:40px; border:0; background:none; color:inherit; font:inherit; font-weight:600;
    letter-spacing:.02em; opacity:.55; cursor:pointer; transition:opacity .2s; }
  #bar button[aria-selected="true"] { opacity:1; }
  #ind { position:absolute; top:0; left:0; width:25%; height:3px; background:#fff; border-radius:0 0 3px 3px;
    transform:translateX(calc(var(--p,0) * 100%)); }

  .arrow { display:none; position:absolute; top:50%; z-index:5; width:44px; height:44px; margin-top:-22px; border:0;
    border-radius:50%; background:rgba(0,0,0,.5); color:#fff; font-size:22px; line-height:1; cursor:pointer;
    opacity:.45; transition:opacity .2s; }
  .arrow:hover, .arrow:focus-visible { opacity:1; }
  #prev { left:10px; } #next { right:10px; }
  @media (hover:hover) and (pointer:fine) { .arrow { display:block; } }

  /* ---------- Home ---------- */
  #home { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; background:#f3e7db; color:#2b211b;
    -webkit-overflow-scrolling:touch; padding:22px 16px 28px; }
  #home .wrap { max-width:1040px; margin:0 auto; }
  #home h1 { margin:2px 0 2px; font:700 26px/1.15 Georgia,"Times New Roman",serif; letter-spacing:.005em; }
  #home .sub { margin:0 0 18px; color:#7d6657; font-size:13px; min-height:16px; }
  #home .sub button { border:0; background:none; padding:0 0 0 6px; color:#b8582d; font:inherit; font-weight:600; cursor:pointer; text-decoration:underline; }
  .cards { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:760px) { .cards { grid-template-columns:repeat(3,1fr); } }

  .card { position:relative; display:block; width:100%; min-height:176px; padding:16px 16px 14px; border:0; border-radius:22px;
    text-align:left; font:inherit; color:#fff; cursor:pointer; overflow:hidden; isolation:isolate;
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 8px 22px rgba(60,35,20,.18); transition:transform .18s, box-shadow .18s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 12px 26px rgba(60,35,20,.24); }
  .card:active { transform:scale(.985); }
  .card:focus-visible { outline:3px solid #b8582d; outline-offset:3px; }
  .card .art { position:absolute; right:10px; bottom:6px; width:42%; max-width:190px; z-index:-1; pointer-events:none; }
  .card .art svg { display:block; width:100%; height:auto; }
  .card .app { display:block; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.75; }
  .card .name { display:block; margin:2px 0 14px; font:700 24px/1.1 Georgia,"Times New Roman",serif; }
  .stats { display:flex; gap:22px; }
  .stat { display:block; }
  .stat b { display:block; font:800 38px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .stat i { display:block; margin-top:5px; font-style:normal; font-size:12px; font-weight:600; opacity:.8; }
  .extra { display:block; margin-top:12px; font-size:12px; opacity:.75; min-height:15px; }
  @media (min-width:760px) { .card { min-height:230px; } .card .art { width:48%; } .stat b { font-size:34px; } }

  /* Books: library green, paper lines, cream and amber spines */
  .card.books { background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 7px),
      linear-gradient(140deg,#35705f 0%,#2f5d50 45%,#234a40 100%); }
  .card.books .stat b { color:#f3e7db; }
  .card.books .app { color:#e9cf94; }

  /* Vinyl: dark with warm glow and a slowly turning record */
  .card.vinyl { background:
      radial-gradient(120% 90% at 100% 100%, rgba(217,164,65,.20) 0%, rgba(217,164,65,0) 55%),
      linear-gradient(150deg,#26201b 0%,#15120f 70%); }
  .card.vinyl .stat b { color:#f1c36a; }
  .card.vinyl .app { color:#d9a441; }
  .card.vinyl .art { right:-26px; bottom:-30px; width:56%; max-width:230px; }
  .card.vinyl .art svg .spin { transform-origin:80px 80px; animation:spin 26s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Games: night indigo, pixel grid, bright arcade accents */
  .card.games { background:
      linear-gradient(rgba(122,134,255,.10) 1px, transparent 1px) 0 0/22px 22px,
      linear-gradient(90deg, rgba(122,134,255,.10) 1px, transparent 1px) 0 0/22px 22px,
      linear-gradient(145deg,#1d2370 0%,#121650 55%,#0d1030 100%); }
  .card.games .stat b { color:#a9b1ff; }
  .card.games .app { color:#7a86ff; }


  /* Books: an open book with pages that turn */
  .card.books .art svg .page { transform-origin:85px 80px; transform-box:view-box; animation:turn 6.6s ease-in-out infinite; opacity:0; }
  .card.books .art svg .p2 { animation-delay:2.2s; }
  .card.books .art svg .p3 { animation-delay:4.4s; }
  @keyframes turn {
    0%   { transform:scaleX(1);  opacity:1; }
    28%  { transform:scaleX(-1) skewY(-4deg); opacity:1; }
    34%  { transform:scaleX(-1); opacity:0; }
    100% { transform:scaleX(-1); opacity:0; }
  }
  /* Games: buttons get pressed in turn */
  .card.games .art svg .btn { transform-box:fill-box; transform-origin:center; animation:press 4.8s ease-in-out infinite; }
  .card.games .art svg .b1 { animation-delay:0s; }
  .card.games .art svg .b2 { animation-delay:.6s; }
  .card.games .art svg .b3 { animation-delay:1.2s; }
  .card.games .art svg .b4 { animation-delay:1.8s; }
  .card.games .art svg .dpad { animation-delay:2.6s; }
  .card.games .art svg .st1 { animation-name:nudge; animation-delay:3.4s; }
  .card.games .art svg .sel { animation-delay:4.2s; }
  @keyframes press { 0%,10%,100% { transform:none; filter:none; } 3%,7% { transform:translateY(2.5px) scale(.8); filter:brightness(.75); } }
  @keyframes nudge { 0%,14%,100% { transform:none; } 4%,10% { transform:translate(3px,-2px); } }

  @media (prefers-reduced-motion: reduce) { .card.books .art svg .page { animation:none; opacity:0; } .card.games .art svg .btn { animation:none; } .card.vinyl .art svg .spin { animation:none; } .card, .panel { transition:none; } }
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="stage"></div>
  <nav id="bar" role="tablist" aria-label="Libraries"><div id="ind"></div></nav>
</div>

<template id="home-tpl">
  <div id="home">
    <div class="wrap">
      <h1>Libraries</h1>
      <p class="sub"><span id="hstat"></span><button type="button" id="hrefresh">Refresh</button></p>
      <div class="cards">

        <button class="card books" type="button" data-go="books" id="c-books">

            <span class="stat"><b data-n="books.ebook">&ndash;</b><i>Ebooks</i></span>
          </span>
          <span class="extra" id="x-books"></span>
          <span class="art" aria-hidden="true">
            <svg viewBox="0 0 170 140" xmlns="http://www.w3.org/2000/svg">

              <path d="M10 44 L85 56 L160 44 V112 L85 124 L10 112z" fill="#c4602f"/>
              <path d="M18 40 Q52 30 85 46 V116 Q52 100 18 108z" fill="#e8dcc7"/>
              <path d="M152 40 Q118 30 85 46 V116 Q118 100 152 108z" fill="#f3e7db"/>
              <g stroke="#2f5d50" stroke-width="3" stroke-linecap="round" opacity=".5">
                <path d="M30 56 Q50 52 72 62"/><path d="M30 68 Q50 64 72 74"/><path d="M30 80 Q50 76 72 86"/><path d="M30 92 Q46 89 62 95"/>
              </g>
              <g stroke="#2f5d50" stroke-width="3" stroke-linecap="round" opacity=".35">
                <path d="M98 62 Q120 52 140 56"/><path d="M98 74 Q120 64 140 68"/><path d="M98 86 Q120 76 140 80"/>
              </g>
              <g class="page p1"><path d="M85 46 Q118 30 152 40 V108 Q118 100 85 116z" fill="#fbf4ea" stroke="#d8c8ae" stroke-width="1.5"/><path d="M100 62 Q120 54 138 58 M100 74 Q120 66 138 70" stroke="#2f5d50" stroke-width="3" stroke-linecap="round" opacity=".3" fill="none"/></g>
              <g class="page p2"><path d="M85 46 Q118 30 152 40 V108 Q118 100 85 116z" fill="#fbf4ea" stroke="#d8c8ae" stroke-width="1.5"/><path d="M100 62 Q120 54 138 58 M100 74 Q120 66 138 70" stroke="#2f5d50" stroke-width="3" stroke-linecap="round" opacity=".3" fill="none"/></g>
              <g class="page p3"><path d="M85 46 Q118 30 152 40 V108 Q118 100 85 116z" fill="#fbf4ea" stroke="#d8c8ae" stroke-width="1.5"/><path d="M100 62 Q120 54 138 58 M100 74 Q120 66 138 70" stroke="#2f5d50" stroke-width="3" stroke-linecap="round" opacity=".3" fill="none"/></g>

        <button class="card games" type="button" data-go="games" id="c-games">

              <g class="btn b1"><circle cx="132" cy="44" r="7" fill="#ffd36e"/></g>
              <g class="btn b2"><circle cx="146" cy="58" r="7" fill="#ff7aa8"/></g>

              <circle cx="108" cy="76" r="10" fill="#121650"/><circle cx="108" cy="76" r="5.5" fill="#3a44c0"/>

      </div>
    </div>
  </div>
</template>

<script>
/* Libraries: one page that holds Shelf, Musicbox and SavePoint, plus a Home page of counts.
   Change the paths or names here if a repository is ever renamed. */
const LIBS = [
  { id:'books', name:'Books', src:'../Shelf/',     color:'#2f5d50' },
  { id:'vinyl', name:'Vinyl', src:'../Musicbox/',  color:'#15120f' },
  { id:'games', name:'Games', src:'../SavePoint/', color:'#0d1030' },
  { id:'home',  name:'Home',  home:true,           color:'#b8582d' }
];
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCgVHwUEbDsp_DiyAWbIaHW7b5LS7MRwNM",
    authDomain: "shelf-b5282.firebaseapp.com",
    projectId: "shelf-b5282",
    storageBucket: "shelf-b5282.firebasestorage.app",
    messagingSenderId: "137353564152",
    appId: "1:137353564152:web:5e78fb7a5d32cc5342d00d"
  };
const FIREBASE_URL = 'https://www.gstatic.com/firebasejs/10.14.1/';

const $ = s => document.querySelector(s);
const stage = $('#stage'), bar = $('#bar');
const N = LIBS.length;
const HOME = LIBS.findIndex(l => l.home);
let cur = 0;

/* ---------- build ---------- */
const panels = [], frames = [], tabs = [];
LIBS.forEach((lib, i) => {
  const p = document.createElement('div');
  p.className = 'panel'; p.style.background = lib.color;
  let f = null;
  if (lib.home) {
    p.style.background = '#f3e7db';
    p.appendChild(document.getElementById('home-tpl').content.firstElementChild);
  } else {
    f = document.createElement('iframe');
    f.title = lib.name; f.setAttribute('allow', 'camera; clipboard-write; fullscreen');
    p.appendChild(f);
    f.addEventListener('load', () => { if (f.getAttribute('src')) attach(f); });
  }
  stage.appendChild(p); panels.push(p); frames.push(f);

  const b = document.createElement('button');
  b.type = 'button'; b.role = 'tab'; b.textContent = lib.name;
  b.addEventListener('click', () => go(i));
  bar.insertBefore(b, $('#ind')); tabs.push(b);
});
$('#ind').style.width = (100 / N) + '%';
const prevBtn = Object.assign(document.createElement('button'), { id:'prev', className:'arrow', type:'button', textContent:'‹' });
const nextBtn = Object.assign(document.createElement('button'), { id:'next', className:'arrow', type:'button', textContent:'›' });
prevBtn.addEventListener('click', () => go(cur - 1));
nextBtn.addEventListener('click', () => go(cur + 1));
stage.append(prevBtn, nextBtn);

/* ---------- layout ---------- */
function width() { return stage.clientWidth || window.innerWidth; }
/* Position of panel i relative to the current one, going round in a circle. */
function dOf(i, c) { const h = Math.floor(N / 2); return (((i - c + h) % N) + N) % N - h; }
function place(offset) {
  const W = width();
  panels.forEach((p, i) => { p.style.transform = 'translate3d(' + (dOf(i, cur) * W + offset) + 'px,0,0)'; });
  bar.style.setProperty('--p', String(Math.min(N - 1, Math.max(0, cur - offset / W))));
}
function paint() {
  const c = LIBS[cur].color;
  document.documentElement.style.setProperty('--bar', c);
  $('#tc').setAttribute('content', c);
  tabs.forEach((b, i) => b.setAttribute('aria-selected', i === cur ? 'true' : 'false'));
  panels.forEach((p, i) => { p.inert = i !== cur; p.setAttribute('aria-hidden', i === cur ? 'false' : 'true'); });
  prevBtn.title = LIBS[(cur - 1 + N) % N].name; nextBtn.title = LIBS[(cur + 1) % N].name;
  prevBtn.setAttribute('aria-label', 'Previous library'); nextBtn.setAttribute('aria-label', 'Next library');
}

/* ---------- loading ---------- */
function ensure(i) { const f = frames[i]; if (f && !f.getAttribute('src')) f.setAttribute('src', LIBS[i].src); }
function loadRest() {
  const order = []; for (let d = 1; d < N; d++) { order.push(cur + d, cur - d); }
  const seen = new Set();
  order.map(i => ((i % N) + N) % N).filter(i => i !== cur && !seen.has(i) && seen.add(i)).forEach((i, k) => setTimeout(() => ensure(i), 400 * k));
}

/* ---------- navigation ---------- */
function go(i, opts) {
  opts = opts || {};
  i = ((i % N) + N) % N;                       /* full circle */
  const changed = i !== cur;
  const before = panels.map((p, k) => dOf(k, cur));
  cur = i; ensure(cur); paint();
  panels.forEach(p => p.classList.remove('drag'));
  panels.forEach((p, k) => { if (Math.abs(dOf(k, cur) - before[k]) > 1) p.classList.add('drag'); });   /* a panel going round the back must not slide across the screen */
  place(0);
  void stage.offsetWidth;
  panels.forEach(p => p.classList.remove('drag'));
  if (changed && !opts.silent) {
    try { history.replaceState(null, '', '#' + LIBS[cur].id); } catch (e) {}
    try { localStorage.setItem('libraries.last', LIBS[cur].id); } catch (e) {}
    setTimeout(() => { try { if (frames[cur]) frames[cur].contentWindow.focus(); } catch (e) {} }, 340);
  }
  if (cur === HOME) { updateShelfCounts(); refreshCounts(false); }
}
function key(e) {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  e.preventDefault();
  go(cur + (e.key === 'ArrowRight' ? 1 : -1));
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => place(0));
window.addEventListener('hashchange', () => { const k = LIBS.findIndex(l => '#' + l.id === location.hash); if (k > -1 && k !== cur) go(k, { silent:true }); });

/* ---------- swipe and keys inside the apps ----------
   The apps live on the same origin, so this page can listen to their touches directly. */
function inHorizontalScroller(el, win) {
  for (; el && el.nodeType === 1; el = el.parentElement) {
    const cs = win.getComputedStyle(el);
    if ((cs.overflowX === 'auto' || cs.overflowX === 'scroll') && el.scrollWidth > el.clientWidth + 2) return true;
  }
  return false;
}
function attach(frame) {
  let doc, win;
  try { win = frame.contentWindow; doc = frame.contentDocument; void doc.body; } catch (e) { return; }
  if (!doc || !win) return;
  attachDoc(doc, win, frames.indexOf(frame), true);
}
function attachDoc(doc, win, idx, withKeys) {
  let t = null;
  if (withKeys) doc.addEventListener('keydown', key);

  doc.addEventListener('touchstart', e => {
    t = null;
    if (idx !== cur || e.touches.length !== 1) return;
    const p = e.touches[0], tg = e.target;
    if (p.clientX < 24 || p.clientX > win.innerWidth - 24) return;                       /* leave the browser's own edge gestures alone */
    if (tg.closest && tg.closest('input[type=range],textarea,[contenteditable="true"]')) return;
    t = { x:p.screenX, y:p.screenY, time:Date.now(), mode:'pending', target:tg, dx:0 };
  }, { passive:true });

  doc.addEventListener('touchmove', e => {
    if (!t) return;
    if (e.touches.length !== 1) { cancel(); return; }
    const p = e.touches[0], dx = p.screenX - t.x, dy = p.screenY - t.y;
    if (t.mode === 'pending') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.3 && !inHorizontalScroller(t.target, win)) {
        t.mode = 'h'; panels.forEach(pl => pl.classList.add('drag'));
      } else { t = null; return; }
    }
    if (t.mode === 'h') {
      if (e.cancelable) e.preventDefault();
      t.dx = dx;
      place(dx);
    }
  }, { passive:false });

  function cancel() { if (t && t.mode === 'h') go(cur); t = null; }
  doc.addEventListener('touchcancel', cancel, { passive:true });
  doc.addEventListener('touchend', () => {
    if (!t) return;
    const s = t; t = null;
    if (s.mode !== 'h') return;
    const dt = Math.max(1, Date.now() - s.time), v = s.dx / dt, W = width();
    const far = Math.abs(s.dx) > W * 0.25, quick = Math.abs(s.dx) > 40 && Math.abs(v) > 0.45;
    if (far || quick) go(cur + (s.dx < 0 ? 1 : -1)); else go(cur);
  }, { passive:true });
}
attachDoc(document, window, HOME, false);   /* swipes on the Home page */

/* ---------- Home: counts ----------
   Books come from Shelf's own saved data on this device (same address, so this page can read it).
   Vinyl and Games are counted in Firebase with small count queries; nothing is downloaded.
   The last counts are kept so the page still shows numbers offline. */
const CACHE_KEY = 'libraries.counts';
let counts = { books:{}, vinyl:{}, games:{} }, meta = { at:0, offline:false, signedOut:false };
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.counts) { counts = c.counts; meta.at = c.at || 0; } } catch (e) {}
const fmtN = n => (n == null ? '–' : Number(n).toLocaleString('en-IE'));
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function setNum(el, v) {
  const to = v == null ? null : +v, from = el._v;
  el._v = to;
  if (to == null || reduce || from === to || from == null) { el.textContent = fmtN(to); return; }
  const t0 = performance.now(), d = 450;
  (function step(t) { const k = Math.min(1, (t - t0) / d); el.textContent = fmtN(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1 && el._v === to) requestAnimationFrame(step); })(t0);
}
function render() {
  document.querySelectorAll('#home [data-n]').forEach(el => { const [a, b] = el.dataset.n.split('.'); setNum(el, (counts[a] || {})[b]); });
  const b = counts.books || {};
  $('#x-books').textContent = b.audio ? '+ ' + fmtN(b.audio) + ' audiobook' + (b.audio === 1 ? '' : 's') : '';
  const g = counts.games || {};
  $('#x-games').textContent = (g.total != null) ? fmtN(g.total) + ' game' + (g.total === 1 ? '' : 's') + ' in total' : '';
  const v = counts.vinyl || {};
  $('#x-vinyl').textContent = '';
  const hs = $('#hstat'), when = meta.at ? new Date(meta.at).toLocaleTimeString('en-IE', { hour:'2-digit', minute:'2-digit' }) : '';
  hs.textContent = meta.signedOut ? 'Sign in to any library to see Vinyl and Games counts.'
    : meta.offline ? (when ? 'Offline. Showing counts from ' + when + '.' : 'Offline.')
    : (when ? 'Updated ' + when : 'Counting…');
  const ab = (id, text) => { const c = $('#c-' + id); if (c) c.setAttribute('aria-label', text); };
  ab('books', 'Books: ' + fmtN(b.physical) + ' physical, ' + fmtN(b.ebook) + ' ebooks. Open Shelf');
  ab('vinyl', 'Vinyl: ' + fmtN(v.total) + ' registered. Open Musicbox');
  ab('games', 'Games: ' + fmtN(g.physical) + ' physical, ' + fmtN(g.digital) + ' digital. Open SavePoint');
}
function persist() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ counts, at:meta.at })); } catch (e) {} }

/* Books: Ebook is an ebook, Audiobook is counted on its own line, everything else is a physical book.
   Re-read entries are not counted again. */
function updateShelfCounts() {
  try {
    const raw = localStorage.getItem('shelf.v1'); if (!raw) { render(); return; }
    const books = (JSON.parse(raw).books || []).filter(b => !b.rep);
    const f = b => String(b.format || '').toLowerCase();
    counts.books = {
      physical: books.filter(b => f(b) !== 'ebook' && f(b) !== 'audiobook').length,
      ebook:    books.filter(b => f(b) === 'ebook').length,
      audio:    books.filter(b => f(b) === 'audiobook').length
    };
    persist(); render();
  } catch (e) { render(); }
}
window.addEventListener('storage', e => { if (e.key === 'shelf.v1') { clearTimeout(updateShelfCounts._t); updateShelfCounts._t = setTimeout(updateShelfCounts, 600); } });

let fbP = null, lastFetch = 0, busy = false;
function firebase() {
  if (fbP) return fbP;
  fbP = Promise.all([import(FIREBASE_URL + 'firebase-app.js'), import(FIREBASE_URL + 'firebase-auth.js'), import(FIREBASE_URL + 'firebase-firestore.js')])
    .then(([A, Au, F]) => { const app = A.initializeApp(FIREBASE_CONFIG); return { Au, F, auth:Au.getAuth(app), db:F.getFirestore(app) }; })
    .catch(e => { fbP = null; throw e; });
  return fbP;
}
function whenAuth(fb) {
  return new Promise(res => { const off = fb.Au.onAuthStateChanged(fb.auth, u => { try { off(); } catch (e) {} res(u); }); });
}
async function countOf(fb, name, field, value) {
  let q = fb.F.collection(fb.db, name);
  if (field) q = fb.F.query(q, fb.F.where(field, '==', value));
  const snap = await fb.F.getCountFromServer(q);
  return snap.data().count;
}
async function refreshCounts(force) {
  if (busy) return;
  if (!force && Date.now() - lastFetch < 20000) return;
  busy = true; lastFetch = Date.now();
  try {
    let fb;
    try { fb = await firebase(); } catch (e) { meta.offline = true; render(); return; }
    const user = await Promise.race([whenAuth(fb), new Promise(r => setTimeout(() => r('timeout'), 8000))]);
    if (user === 'timeout') { meta.offline = true; render(); return; }
    if (!user) { meta.signedOut = true; meta.offline = false; render(); return; }
    meta.signedOut = false;
    const [vt, gt, gp, gd] = await Promise.allSettled([
      countOf(fb, 'vinyl'), countOf(fb, 'games'), countOf(fb, 'games', 'format', 'physical'), countOf(fb, 'games', 'format', 'digital')
    ]);
    const ok = r => r.status === 'fulfilled';
    if (ok(vt)) counts.vinyl = { total:vt.value };
    if (ok(gt)) {
      const phys = ok(gp) ? gp.value : null, dig = ok(gd) ? gd.value : null;
      /* Until SavePoint stores a format on its games, the split stays blank instead of showing zeros. */
      const split = (phys || 0) + (dig || 0) > 0;
      counts.games = { total:gt.value, physical:split ? phys : null, digital:split ? dig : null };
    }
    const anyOk = ok(vt) || ok(gt);
    meta.offline = !anyOk;
    if (anyOk) { meta.at = Date.now(); persist(); }
    render();
  } finally { busy = false; }
}
document.addEventListener('click', e => {
  const c = e.target.closest && e.target.closest('#home [data-go]');
  if (c) { const k = LIBS.findIndex(l => l.id === c.dataset.go); if (k > -1) go(k); return; }
  if (e.target && e.target.id === 'hrefresh') { updateShelfCounts(); refreshCounts(true); }
});
window.addEventListener('online', () => { meta.offline = false; refreshCounts(true); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && cur === HOME) { updateShelfCounts(); refreshCounts(false); } });

/* ---------- start ---------- */
(function start() {
  let k = LIBS.findIndex(l => '#' + l.id === location.hash);
  cur = k > -1 ? k : HOME;   /* Home is always the opening page; a #books style link still goes straight to that library */
  ensure(cur); paint(); place(0); render(); updateShelfCounts();
  const first = frames[cur];
  if (first) first.addEventListener('load', () => setTimeout(loadRest, 300), { once:true }); else setTimeout(loadRest, 300);
  setTimeout(loadRest, 4000);   /* in case the first app is slow to report that it has loaded */
  setTimeout(() => refreshCounts(true), cur === HOME ? 200 : 2500);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
